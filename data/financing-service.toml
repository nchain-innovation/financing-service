[blockchain_interface]
interface_type = "woc"
network_type = "regtest"
# Self-hosted woc-api (the `woc` Docker profile). Service name and container
# port, because the service reaches it across the Compose network.
# For a non-Docker `cargo run`, use the published host port instead:
#   url = "http://localhost:5010"
#   url = "http://woc-api:8084"

[web_interface]
address = "127.0.0.1"
port = 8080
# [web_interface.rate_limit]
# enabled = true
# requests_per_second = 10
# burst_size = 20

[logging]
level = "info"

# [telemetry]
# enabled = true
# service_name = "financing-service"
# otlp_endpoint = "http://localhost:4317"

[service]
utxo_refresh_period = 60

[dynamic_config]
filename = "./data/dynamic.toml"

# [[client]]
# client_id = "id1"
# wif_key = ""
