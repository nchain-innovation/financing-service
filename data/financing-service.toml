[blockchain_interface]
interface_type = "woc"
network_type = "testnet"
# For a local node, the only way to reach regtest. The service imports each
# client's address into the node's wallet so their balances are visible.
# interface_type = "rpc"
# network_type = "regtest"
# url = "127.0.0.1:18443"
# rpc_user = "rpcuser"
# rpc_password = "env:FS_RPC_PASSWORD"
# rpc_import_addresses = true
# Ceiling on outbound requests to the blockchain interface. Defaults to 3 for
# woc, which documents "up to 3 requests/sec is free" and answers 429 above it;
# unset for rpc and uaas, which are your own servers. 0 turns it off.
# max_requests_per_second = 3
# url = "http://localhost:5010"

[web_interface]
address = "127.0.0.1"
port = 8080
# [web_interface.rate_limit]
# enabled = true
# requests_per_second = 10
# burst_size = 20

[logging]
level = "info"

# [telemetry]
# enabled = true
# service_name = "financing-service"
# otlp_endpoint = "http://localhost:4317"

[service]
utxo_refresh_period = 60
# How old cached chain state may be before a request refreshes it. Defaults to
# utxo_refresh_period, so a request reuses what the periodic refresh last
# fetched. Lower it to narrow the window in which the service can build on a
# view something outside it has moved on from; 0 refreshes on every request.
# chain_state_max_age_seconds = 60
# What the service has broadcast but the chain may not have caught up with --
# the inputs it has spent and the change it has created -- is written here after
# every funding commit and read back at startup, so a restart does not rebuild
# transactions it has just sent. Defaults beside dynamic_config.filename, named
# after it; it must survive a restart just as that file does.
# inflight_state_file = "./data/dynamic.inflight.json"

[dynamic_config]
filename = "./data/dynamic.toml"

# [[client]]
# client_id = "id1"
# wif_key = ""

# Retention for POST /fund idempotency records. Optional; these are the
# defaults. Records are held in memory only and are lost on restart.
# [idempotency]
# ttl_seconds = 600
# max_entries = 10000

# Optional. When present, funding transactions are broadcast through mapi-lite
# instead of the [blockchain_interface] above; chain reads (balances, UTXOs)
# still use [blockchain_interface]. GET /ready then probes mapi-lite too;
# GET /health stays a pure liveness check.
# Only base_url is required; the rest are the defaults.
# [mapi_lite]
# base_url = "http://127.0.0.1:8080"
# auth_token = "env:FS_MAPI_LITE_AUTH_TOKEN"   # sent verbatim: include the scheme, e.g. "Bearer <secret>"
# timeout_seconds = 13
# health_timeout_seconds = 2
# max_retries = 2

# The fee the service pays on the transactions it builds. Optional; these are
# the defaults.
#
# The fee is ceil(tx_bytes * satoshis_per_kb / 1000), rounded up so rounding
# never underpays. An ordinary funding transaction -- one input, two outputs --
# is 226 bytes, so at 100 sat/KB it pays 23 satoshi. tx_bytes is the
# serialised size, counted as an upper bound, so the rate is never undercut.
#
# Before v4.3.0 this was hardcoded as ((tx_bytes / 1000) * 500) + 750, which
# charged 750 for that same transaction. Upgrading without setting these pays
# the lower rate.
#
# With [mapi_lite] configured, the rate is taken from its feeQuote and
# satoshis_per_kb becomes the fallback used before the first quote and whenever
# one cannot be had. Set use_mapi_fee_quote = false to always use the number
# below.
#
# Change too small to be worth an output is not paid back -- it stays in the
# transaction and the miner takes it as fee. The threshold for that is derived
# from the rate above rather than configured: it is the round-trip cost of a
# change output, max(1, 2 * ceil(182 * satoshis_per_kb / 1000)), which is 38
# satoshi at 100 sat/KB.
# [fees]
# satoshis_per_kb = 100
# use_mapi_fee_quote = true
