name: Rust

# Every push, on every branch, plus every pull request whatever it targets.
#
# The branch filters used to be `main` on both, which meant a stacked pull
# request -- one based on another review branch rather than on main -- was
# never built at all. Work could sit for days with no check against it and
# nothing saying so.
on:
  push:
  pull_request:

# A branch only needs its newest commit built. Superseded runs are cancelled,
# except on main, where every commit keeps its own result: a cancelled run
# reports as cancelled rather than green, and main's history should not have
# holes in it.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

env:
  CARGO_TERM_COLOR: always

jobs:
  build:

    runs-on: ubuntu-latest

    steps:
    # uls-client comes from the PRIVATE mapi-lite repo over SSH, so the
    # checkout is not what needs the credential -- the dependency fetch is.
    # Without the key, the first failure would be an opaque git error from
    # deep inside cargo, so fail here instead with something actionable.
    - name: Check the mapi-lite deploy key is configured
      env:
        KEY: ${{ secrets.MAPI_LITE_DEPLOY_KEY }}
      run: |
        if [ -z "$KEY" ]; then
          echo "::error::Secret MAPI_LITE_DEPLOY_KEY is not set. This build fetches" \
               "uls-client from the private nchain-innovation/mapi-lite repo over SSH." \
               "Add a read-only deploy key for that repo as this repository's" \
               "MAPI_LITE_DEPLOY_KEY secret. See docs/Dependencies.md."
          exit 1
        fi
    - uses: actions/checkout@v7
    # .cargo/config.toml sets net.git-fetch-with-cli = true, so the runner's
    # own git performs the fetch and picks the key up from the agent exactly
    # as a developer's git does. The action also writes github.com into
    # known_hosts. chain-gang needs none of this: it comes from crates.io.
    - name: Load the mapi-lite deploy key into ssh-agent
      uses: webfactory/ssh-agent@v0.9.0
      with:
        ssh-private-key: ${{ secrets.MAPI_LITE_DEPLOY_KEY }}
    - name: Check formatting
      run: cargo fmt --all -- --check
    - name: Clippy
      run: cargo clippy --verbose -- -D warnings
    - uses: taiki-e/install-action@cargo-audit
    - name: Audit dependencies
      run: cargo audit
    - name: Build
      run: cargo build --verbose
    - name: Run tests
      run: cargo test --verbose
