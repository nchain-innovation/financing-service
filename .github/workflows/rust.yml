name: Rust
# CI runner image is pinned, not `ubuntu-latest`. That label migrates to Ubuntu 26
# between 19 October and 19 November 2026 (actions/runner-images#14748), which
# would move the OS under every build on a date nobody chose. Pinning decouples
# the upgrade from that date so it happens deliberately (CS-442).
#
# Now on 26.04, moved ahead of the migration on the evidence of a trial run
# rather than by the calendar (CS-444, run 35712755368 -- green). Staying
# pinned keeps the next migration a decision too.
#
# This workflow caches nothing, so it has none of the cross-image cache problem
# that made the same move elsewhere a two-part change: there is no target/ dir
# to restore from the wrong image.

# Every push, on every branch, plus every pull request whatever it targets.
#
# The branch filters used to be `main` on both, which meant a stacked pull
# request -- one based on another review branch rather than on main -- was
# never built at all. Work could sit for days with no check against it and
# nothing saying so.
on:
  push:
  pull_request:

# A branch only needs its newest commit built. Superseded runs are cancelled,
# except on main, where every commit keeps its own result: a cancelled run
# reports as cancelled rather than green, and main's history should not have
# holes in it.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

env:
  CARGO_TERM_COLOR: always

# The workflow token gets nothing unless a job asks for it (CS-528).
permissions: {}

jobs:
  build:

    runs-on: ubuntu-26.04
    permissions:
      contents: read  # for actions/checkout

    # Every action is pinned by commit SHA, with the release it was taken from
    # in a comment (CS-528). A tag can be moved to other code at any time, and
    # this job hands one of these actions the mapi-lite deploy key: a moved tag
    # could take the key, and the private source with it. To update one,
    # resolve the new release's tag to its commit and replace both;
    # `system_requirements::tests::sr_sec_027_*` fails on one that is not.
    steps:
    # cargo audit reads only Cargo.lock, so it runs first -- before the deploy
    # key is loaded, so the third-party installer never shares a job with the
    # key in the agent. It used to run after.
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        persist-credentials: false  # no later step needs the token in .git/config
    - name: Install cargo-audit
      uses: taiki-e/install-action@1168f6810a3cb30a3514bf5756a3b7f0422c6df8 # v2.87.28
      with:
        tool: cargo-audit@0.22.2
    - name: Audit dependencies
      run: cargo audit
    # uls-client comes from the PRIVATE mapi-lite repo over SSH, so the
    # checkout is not what needs the credential -- the dependency fetch is.
    # Without the key, the first failure would be an opaque git error from
    # deep inside cargo, so fail here instead with something actionable.
    - name: Check the mapi-lite deploy key is configured
      env:
        KEY: ${{ secrets.MAPI_LITE_DEPLOY_KEY }}
      run: |
        if [ -z "$KEY" ]; then
          echo "::error::Secret MAPI_LITE_DEPLOY_KEY is not set. This build fetches" \
               "uls-client from the private nchain-innovation/mapi-lite repo over SSH." \
               "Add a read-only deploy key for that repo as this repository's" \
               "MAPI_LITE_DEPLOY_KEY secret. See docs/Dependencies.md."
          exit 1
        fi
    # .cargo/config.toml sets net.git-fetch-with-cli = true, so the runner's
    # own git performs the fetch and picks the key up from the agent exactly
    # as a developer's git does. The action also writes github.com into
    # known_hosts. chain-gang needs none of this: it comes from crates.io.
    - name: Load the mapi-lite deploy key into ssh-agent
      # v0.10.0 is the release that moved to Node 24; v0.9.x ran on Node 20,
      # which GitHub is deprecating on its runners.
      uses: webfactory/ssh-agent@e83874834305fe9a4a2997156cb26c5de65a8555 # v0.10.0
      with:
        ssh-private-key: ${{ secrets.MAPI_LITE_DEPLOY_KEY }}
    - name: Check formatting
      run: cargo fmt --all -- --check
    - name: Clippy
      run: cargo clippy --verbose -- -D warnings
    - name: Build
      run: cargo build --verbose
    - name: Run tests
      run: cargo test --verbose
