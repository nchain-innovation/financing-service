name: Rust
# CI runner image is pinned, not `ubuntu-latest`. That label migrates to Ubuntu 26
# between 19 October and 19 November 2026 (actions/runner-images#14748), which
# would move the OS under every build on a date nobody chose. Pinning decouples
# the upgrade from that date so it happens deliberately (CS-442).
#
# Now on 26.04, moved ahead of the migration on the evidence of a trial run
# rather than by the calendar (CS-444, run 35712755368 -- green). Staying
# pinned keeps the next migration a decision too.
#
# This workflow caches nothing, so it has none of the cross-image cache problem
# that made the same move elsewhere a two-part change: there is no target/ dir
# to restore from the wrong image.

# Every push, on every branch, plus every pull request whatever it targets.
#
# The branch filters used to be `main` on both, which meant a stacked pull
# request -- one based on another review branch rather than on main -- was
# never built at all. Work could sit for days with no check against it and
# nothing saying so.
on:
  push:
  pull_request:

# A branch only needs its newest commit built. Superseded runs are cancelled,
# except on main, where every commit keeps its own result: a cancelled run
# reports as cancelled rather than green, and main's history should not have
# holes in it.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

env:
  CARGO_TERM_COLOR: always

# The workflow token gets nothing unless a job asks for it (CS-528).
permissions: {}

jobs:
  build:

    runs-on: ubuntu-26.04
    permissions:
      contents: read  # for actions/checkout

    # Every action is pinned by commit SHA, with the release it was taken from
    # in a comment (CS-528). A tag can be moved to other code at any time, and
    # this job hands one of these actions the mapi-lite deploy key: a moved tag
    # could take the key, and the private source with it. To update one,
    # resolve the new release's tag to its commit and replace both;
    # `system_requirements::tests::sr_sec_027_*` fails on one that is not.
    steps:
    # cargo audit reads only Cargo.lock, so it runs first -- before the deploy
    # key is loaded, so the third-party installer never shares a job with the
    # key in the agent. It used to run after.
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        persist-credentials: false  # no later step needs the token in .git/config
    - name: Install cargo-audit
      uses: taiki-e/install-action@1168f6810a3cb30a3514bf5756a3b7f0422c6df8 # v2.87.28
      with:
        tool: cargo-audit@0.22.2
    - name: Audit dependencies
      run: cargo audit
    # uls-client comes from the PRIVATE mapi-lite repo over SSH, so the
    # checkout is not what needs the credential -- the dependency fetch is.
    # Without the key, the first failure would be an opaque git error from
    # deep inside cargo, so fail here instead with something actionable.
    - name: Check the mapi-lite deploy key is configured
      env:
        KEY: ${{ secrets.MAPI_LITE_DEPLOY_KEY }}
      run: |
        if [ -z "$KEY" ]; then
          echo "::error::Secret MAPI_LITE_DEPLOY_KEY is not set. This build fetches" \
               "uls-client from the private nchain-innovation/mapi-lite repo over SSH." \
               "Add a read-only deploy key for that repo as this repository's" \
               "MAPI_LITE_DEPLOY_KEY secret. See docs/Dependencies.md."
          exit 1
        fi
    # .cargo/config.toml sets net.git-fetch-with-cli = true, so the runner's
    # own git performs the fetch and picks the key up from the agent exactly
    # as a developer's git does. The action also writes github.com into
    # known_hosts. chain-gang needs none of this: it comes from crates.io.
    - name: Load the mapi-lite deploy key into ssh-agent
      # v0.10.0 is the release that moved to Node 24; v0.9.x ran on Node 20,
      # which GitHub is deprecating on its runners.
      uses: webfactory/ssh-agent@e83874834305fe9a4a2997156cb26c5de65a8555 # v0.10.0
      with:
        ssh-private-key: ${{ secrets.MAPI_LITE_DEPLOY_KEY }}
    - name: Check formatting
      run: cargo fmt --all -- --check
    - name: Clippy
      run: cargo clippy --verbose -- -D warnings
    - name: Build
      run: cargo build --verbose
    - name: Run tests
      run: cargo test --verbose

  # The container image (CS-606). Built for every pull request, so one that
  # breaks the Dockerfile fails here, and pushed to ghcr.io only from main and
  # from vX.Y.Z tags, once `build` has passed. A push to any other branch is
  # already built by its pull request, so it skips this. Tagged :sha-<commit>
  # always, :main from main, and :X.Y.Z and :latest from a release tag; the OCI
  # labels name the source repository and commit.
  image:
    name: container image
    needs: build
    if: >-
      github.event_name == 'pull_request' ||
      github.ref == 'refs/heads/main' ||
      startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-26.04
    # A release tag also builds arm64, under QEMU: several times slower.
    timeout-minutes: ${{ startsWith(github.ref, 'refs/tags/v') && 180 || 45 }}
    # The one write permission in this workflow (SR-SEC-028), and only this
    # job's: nothing is pushed from a pull request.
    permissions:
      contents: read  # for actions/checkout
      packages: write  # to push to ghcr.io
    env:
      PUBLISH: ${{ github.event_name == 'push' }}
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        persist-credentials: false
    # The Dockerfile fetches uls-client as `build` does, through the agent:
    # its build step mounts it with `--mount=type=ssh`, and build-push-action
    # forwards it with `ssh: default`. The key reaches that one RUN, never a
    # layer.
    - name: Load the mapi-lite deploy key into ssh-agent
      uses: webfactory/ssh-agent@e83874834305fe9a4a2997156cb26c5de65a8555 # v0.10.0
      with:
        ssh-private-key: ${{ secrets.MAPI_LITE_DEPLOY_KEY }}
    # Release tags publish amd64 and arm64, as multi-build.sh does. arm64 is
    # emulated, so only a tag builds it; pull requests and main build amd64
    # alone, natively.
    - name: Set up QEMU for arm64
      if: startsWith(github.ref, 'refs/tags/v')
      uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
      with:
        platforms: arm64
    - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
    - name: Image tags and labels
      id: meta
      uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
      with:
        images: ghcr.io/${{ github.repository }}
        # :latest only from a release tag, never from main.
        flavor: latest=false
        tags: |
          type=sha
          type=ref,event=branch
          type=semver,pattern={{version}}
          type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/v') }}
    - name: Log in to ghcr.io
      if: env.PUBLISH == 'true'
      uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
      with:
        registry: ghcr.io
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    - name: Build, and push from main or a release tag
      uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
      with:
        context: .
        ssh: default
        platforms: ${{ startsWith(github.ref, 'refs/tags/v') && 'linux/amd64,linux/arm64' || 'linux/amd64' }}
        push: ${{ env.PUBLISH == 'true' }}
        tags: ${{ steps.meta.outputs.tags }}
        labels: ${{ steps.meta.outputs.labels }}
        cache-from: type=gha
        cache-to: type=gha,mode=max
