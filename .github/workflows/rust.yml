name: Rust

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

env:
  CARGO_TERM_COLOR: always

jobs:
  build:

    runs-on: ubuntu-latest

    steps:
    # v7 runs on Node 24. v4 ran on Node 20, which GitHub deprecated on its
    # runners; the warning it emitted named no step, so: this was the one.
    # taiki-e/install-action below is a composite (shell) action and has no
    # Node runtime to deprecate.
    - uses: actions/checkout@v7
    - name: Check formatting
      run: cargo fmt --all -- --check
    - name: Clippy
      run: cargo clippy --verbose -- -D warnings
    - uses: taiki-e/install-action@cargo-audit
    - name: Audit dependencies
      run: cargo audit
    - name: Build
      run: cargo build --verbose
    - name: Run tests
      run: cargo test --verbose
