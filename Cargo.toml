[package]
name = "financing-service"
version = "4.3.0"
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
actix-web = { version = "4.15.0", default-features = false, features = ["macros", "compress-brotli", "compress-gzip", "compress-zstd", "cookies", "unicode", "compat", "ws"] }
serde = { version = "1.0.229", features =["derive"] }
toml = "1.1.6"
serde_json = "1.0.151"
tokio = { version = "1.53.1", features = ["full"] }
chrono = "0.4.45"
hex = "0.4.3"
async-trait = "0.1.92"
chain-gang = { version = "0.11.5", features = ["interface"] }
log = { version = "0.4.34", features = ["max_level_trace", "release_max_level_warn"] }
opentelemetry = { version = "0.32", features = ["trace"] }
opentelemetry-otlp = { version = "0.32", features = ["grpc-tonic", "trace"] }
opentelemetry_sdk = { version = "0.32", features = ["trace"] }
tracing-actix-web = { version = "0.7", features = ["opentelemetry_0_32"] }
tracing-log = "0.2"
tracing-opentelemetry = "0.33"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
actix-governor = "0.10.0"

# The optional mapi-lite transaction broadcaster ([mapi_lite] in config).
# uls-client is mapi-lite's typed HTTP client and uls-core its wire types; both
# live in the PRIVATE nchain-innovation/mapi-lite repo, so they are git+ssh
# pins (cargo needs the ssh:// URL form, and .cargo/config.toml hands the fetch
# to the system git). They MUST name the same rev, and that rev's chain-gang
# requirement must be satisfiable by the chain-gang line above, or the graph
# carries two chain-gangs and their types stop unifying. This is the same rev
# teranode-event-rs pins. See docs/Dependencies.md before changing it.
uls-client = { git = "ssh://git@github.com/nchain-innovation/mapi-lite.git", rev = "ab3c95846a72976783e5f2d901b69d75768426bc" }
uls-core = { git = "ssh://git@github.com/nchain-innovation/mapi-lite.git", rev = "ab3c95846a72976783e5f2d901b69d75768426bc" }
# Only to build the timeout-bearing HTTP clients handed to uls-client, which
# has no timeout setting of its own. Same major.minor as mapi-lite's so one
# reqwest resolves; its TLS backend is whatever uls-client enables.
reqwest = { version = "0.13", default-features = false }

[dev-dependencies]
actix-http = "3"
# MapiBroadcaster tests: a mock mapi-lite serving the real wire shapes, with
# uls-core signing the envelopes the way the server does.
wiremock = "0.6"
