[package]
name = "financing-service"
version = "4.5.0"
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
actix-web = { version = "4.15.0", default-features = false, features = ["macros", "compress-brotli", "compress-gzip", "compress-zstd", "cookies", "unicode", "compat", "ws"] }
serde = { version = "1.0.229", features =["derive"] }
toml = "1.1.6"
# The configuration loader: the TOML file, then FS__ environment overrides
# (CS-624), as teranode-event-rs (TE__) and mapi-lite (MAPI__) load theirs.
# serde_ignored names every key no setting reads, which is refused.
config = "0.15"
serde_ignored = "0.1"
serde_json = "1.0.151"
tokio = { version = "1.53.1", features = ["full"] }
chrono = "0.4.45"
hex = "0.4.3"
async-trait = "0.1.92"
chain-gang = { version = "0.13.0", features = ["interface"] }
# No `max_level_*` or `release_max_level_*` features: Cargo merges them across
# the dependency graph, and `release_max_level_warn` compiled every level below
# `warn` out of the release build the Docker image runs, whatever the configured
# level. chain-gang set it too until 0.13.1, so the bump above is part of this.
log = "0.4.34"
opentelemetry = { version = "0.32", features = ["trace", "metrics"] }
opentelemetry-otlp = { version = "0.32", features = ["grpc-tonic", "trace", "metrics"] }
opentelemetry_sdk = { version = "0.32", features = ["trace", "metrics", "rt-tokio"] }
tracing-actix-web = { version = "0.7", features = ["opentelemetry_0_32"] }
tracing-log = "0.2"
tracing-opentelemetry = "0.33"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
actix-governor = "0.10.0"

# The optional mapi-lite transaction broadcaster ([mapi_lite] in config).
# uls-client is mapi-lite's typed HTTP client and uls-core its wire types; both
# live in the PRIVATE nchain-innovation/mapi-lite repo, so they are git+ssh
# pins (cargo needs the ssh:// URL form, and .cargo/config.toml hands the fetch
# to the system git). They MUST name the same rev, and that rev's chain-gang
# requirement must be satisfiable by the chain-gang line above, or the graph
# carries two chain-gangs and their types stop unifying. This is the commit
# mapi-lite tagged v0.5.0, on chain-gang 0.13 -- pinned by rev, which unlike a
# tag cannot move; teranode-event-rs takes the same release by tag (CS-627).
# See docs/Dependencies.md before changing it.
uls-client = { git = "ssh://git@github.com/nchain-innovation/mapi-lite.git", rev = "e360a2a71b5b5b902e955dd6aa714e20adfdd79c" }
uls-core = { git = "ssh://git@github.com/nchain-innovation/mapi-lite.git", rev = "e360a2a71b5b5b902e955dd6aa714e20adfdd79c" }
# For the HTTP client the mapi-lite chain reader (mapi_lite_interface) hands
# uls-client; the broadcaster uses uls-client's own timeouts (v0.5.0). Same
# major.minor as mapi-lite's so one reqwest resolves; its TLS backend is
# whatever uls-client enables.
reqwest = { version = "0.13", default-features = false }

[dev-dependencies]
actix-http = "3"
# MapiBroadcaster tests: a mock mapi-lite serving the real wire shapes, with
# uls-core signing the envelopes the way the server does.
wiremock = "0.6"
# InMemoryMetricExporter, for asserting the CS-608 metrics.
opentelemetry_sdk = { version = "0.32", features = ["testing"] }
