[package]
name = "financing-service"
version = "2.1.0"
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
actix-web = "4.11.0"
serde = { version = "1.0.219", features =["derive"] }
toml = "0.9.5"
serde_json = "1.0.143"
reqwest = { version = "0.12.23", features = ["json"]}
tokio = { version = "1.47.1", features = ["full"] }
chrono = "0.4.42"
hex = "0.4.3"
async-mutex = "1.4.1"
async-trait = "0.1.89"
http = "1.3.1"
chain-gang = { version = "^0.8.0", git = "https://github.com/nchain-innovation/chain-gang.git", features = ["interface"] }
log = { version = "0.4.28", features = ["max_level_trace", "release_max_level_warn"] }
simple_logger = "5.0.0"
